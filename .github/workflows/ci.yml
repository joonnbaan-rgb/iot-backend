name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: iot
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MQTT_URL: mqtt://localhost:1883
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 7
      BCRYPT_SALT_ROUNDS: 10
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ใช้ npm install แทน npm ci ชั่วคราว: เฟส H เพิ่ม ioredis แต่ package-lock.json ยังไม่ถูกอัปเดต
      # (รัน npm install บนเครื่อง แล้ว commit package-lock.json จากนั้นเปลี่ยนกลับเป็น npm ci)
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Run database migrations
        run: npm run migration:run --if-present

      - name: Run unit tests
        run: npm run test --if-present

      - name: Run e2e tests
        run: npm run test:e2e --if-present

  web-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # ยังไม่มี package-lock.json ใน web-admin จึงใช้ npm install
      - run: npm install
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000
