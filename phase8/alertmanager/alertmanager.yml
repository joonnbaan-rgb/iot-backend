# Alertmanager -> backend (POST /internal/alerts) -> ส่งต่อ Telegram/LINE/อีเมล ของ "ผู้ดูแลระบบ" ที่ผูกช่องทางไว้ในแอป
# token ภายในอ่านจากไฟล์ /tmp/am-token (compose สร้างจาก INTERNAL_AUTH_TOKEN ตอนเริ่ม container)
route:
  receiver: backend
  group_by: [alertname]
  group_wait: 30s        # รอรวมแจ้งเตือนที่เกิดพร้อมกัน
  group_interval: 5m
  repeat_interval: 4h    # ยังไม่หาย -> เตือนซ้ำทุก 4 ชั่วโมง

receivers:
  - name: backend
    webhook_configs:
      - url: http://backend:3000/internal/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/am-token
