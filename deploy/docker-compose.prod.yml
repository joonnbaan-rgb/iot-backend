# Production บน VPS เครื่องเดียว (Ubuntu/Debian + Docker)
# เปิดสู่อินเทอร์เน็ตเฉพาะ: 80/443 (Caddy: HTTPS ของ API + สตรีม), 8883 (MQTT over TLS), 8554 (RTSP สำหรับส่งภาพกล้องขึ้นมา มี user/password)
# ฐานข้อมูล, redis, minio, EMQX dashboard และ MediaMTX API เข้าถึงได้เฉพาะในเครือข่ายภายใน docker
#
# ใช้งาน (จากโฟลเดอร์รากของโปรเจกต์):
#   bash deploy/init.sh example.com you@mail.com
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d --build
name: iot

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      STREAM_DOMAIN: ${STREAM_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.invalid}
      MQTT_DOMAIN: ${MQTT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - mediamtx
      - webadmin

  # คัดลอกใบรับรองที่ Caddy ขอไว้ให้ MQTT domain ไปให้ EMQX อ่าน (กุญแจของ Caddy อ่านได้เฉพาะ root)
  certsync:
    image: alpine:3
    restart: unless-stopped
    environment:
      MQTT_DOMAIN: ${MQTT_DOMAIN}
    volumes:
      - caddy_data:/caddy:ro
      - mqtt_certs:/out
    command:
      - sh
      - -c
      - |
        d=/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/$$MQTT_DOMAIN
        while true; do
          if [ -f "$$d/$$MQTT_DOMAIN.crt" ] && [ -f "$$d/$$MQTT_DOMAIN.key" ]; then
            cp "$$d/$$MQTT_DOMAIN.crt" /out/mqtt.crt
            cp "$$d/$$MQTT_DOMAIN.key" /out/mqtt.key
            chmod 644 /out/mqtt.crt /out/mqtt.key
          fi
          sleep 3600
        done
    healthcheck:
      test: ["CMD-SHELL", "test -f /out/mqtt.crt && test -f /out/mqtt.key"]
      interval: 10s
      timeout: 3s
      retries: 60
    depends_on:
      - caddy

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.4.1
    restart: unless-stopped
    ports:
      - "8883:8883" # MQTT over TLS (อุปกรณ์ต่อเข้ามาทางนี้)
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: node1.emqx.io
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      # ต้อง login ทุกการเชื่อมต่อ (ไม่มี anonymous) ผู้ใช้เริ่มต้นอ่านจาก auth.csv ที่ init.sh สร้างให้
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: /opt/emqx/etc/auth.csv
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: plain
      # อุปกรณ์: ผู้ใช้ที่ไม่พบใน DB ด้านบนจะถูกส่งไปให้ backend ตรวจรหัสราย device (username = device id)
      EMQX_AUTHENTICATION__2__MECHANISM: password_based
      EMQX_AUTHENTICATION__2__BACKEND: http
      EMQX_AUTHENTICATION__2__METHOD: post
      EMQX_AUTHENTICATION__2__URL: http://backend:3000/internal/mqtt/authenticate?t=${INTERNAL_AUTH_TOKEN}
      EMQX_AUTHENTICATION__2__BODY__username: "$${username}"
      EMQX_AUTHENTICATION__2__BODY__password: "$${password}"
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: disconnect
      # TLS listener
      EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /certs/mqtt.crt
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /certs/mqtt.key
    volumes:
      - ./emqx/auth.csv:/opt/emqx/etc/auth.csv:ro
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - mqtt_certs:/certs:ro
      - emqx_data:/opt/emqx/data
    depends_on:
      certsync:
        condition: service_healthy

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8554:8554" # RTSP: ส่งภาพกล้องจากบ้านขึ้นมา (ต้องมี user/password)
    volumes:
      - ./mediamtx.prod.yml:/mediamtx.yml:ro
      - recordings:/recordings

  minio:
    image: ghcr.io/coollabsio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_started
      mediamtx:
        condition: service_started
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      PORT: "3000"
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MQTT_URL: mqtt://emqx:1883
      MQTT_USERNAME: backend
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD}
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_PUBLIC_HLS_URL: https://${STREAM_DOMAIN}
      MEDIAMTX_PUBLIC_WEBRTC_URL: https://${STREAM_DOMAIN}
      STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      MQTT_PUBLIC_HOST: ${MQTT_DOMAIN}
      MQTT_PUBLIC_PORT: "8883"
      RECORDINGS_CONTAINER_PATH: /recordings
      RECORDINGS_DIR: /recordings
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: "7"
      BCRYPT_SALT_ROUNDS: "10"
      DEVICE_OFFLINE_THRESHOLD_SECONDS: "60"
      COMMAND_TIMEOUT_MS: "10000"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_BOT_BASIC_ID: ${LINE_BOT_BASIC_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NOTIFY_TZ: Asia/Bangkok
    volumes:
      - recordings:/recordings

  # Web Admin (React) — ไฟล์ static ผ่าน nginx; Caddy เป็นตัวออก HTTPS
  webadmin:
    build:
      context: ../web-admin
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  mqtt_certs:
  emqx_data:
  timescale_data:
  minio_data:
  recordings:
