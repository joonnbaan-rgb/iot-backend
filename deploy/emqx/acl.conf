%% สิทธิ์ MQTT (ผู้ใช้ "backend" เป็น superuser จึงไม่ติดกฎเหล่านี้)
%% อุปกรณ์แต่ละตัวล็อกอินด้วย username = device id ของตัวเอง (ตรวจรหัสผ่านผ่าน backend)
%% และเข้าถึงได้เฉพาะ topic ของตัวเองเท่านั้น ${username} จะถูกแทนด้วยชื่อผู้ใช้ที่ล็อกอินอยู่
{allow, all, publish, ["devices/${username}/telemetry", "devices/${username}/ack"]}.
{allow, all, subscribe, ["devices/${username}/command"]}.
{deny, all}.
